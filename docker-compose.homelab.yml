services:
  homefield:
    image: ghcr.io/stink-o/homefield:latest
    container_name: homefield
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./homefield.env
    volumes:
      - ./storage:/app/storage
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
